# Wizard Magic - Minecraft 1.20.1 / NeoForge mod metadata
#
# Dollar-brace placeholders are expanded by processResources (values live in
# gradle.properties). Do not hardcode versions here.

modLoader="javafml"
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

#issueTrackerURL="https://github.com/MagicalMercury/WizardMagic/issues" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}"

# Has server-side logic (element field, diffusion, commands): client and server must match
displayTest="MATCH_VERSION"

#logoFile="wizardmagic.png" #optional
#updateJSONURL="https://example.invalid/updates.json" #optional
#displayURL="https://example.invalid/" #optional

description='''${mod_description}''' #mandatory

# ------------------------------------------------------------------ dependencies
# On 1.20.1 the NeoForge loader is still registered under the modId "forge"
# (its displayName is NeoForge), so this must stay "forge".
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
