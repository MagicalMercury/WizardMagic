# Gradle 运行参数（反编译/构建 1.20.1 需要比默认 1G 更多的堆）
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ForgeGradle 6 不支持配置缓存，保持关闭
org.gradle.configuration-cache=false

# 若 maven.neoforged.net 不可达，可让 Gradle 走本地代理（取消注释并改成实际端口）
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# systemProp.http.nonProxyHosts=localhost|127.0.0.1

# 映射配置
# channel 可选：official（默认）/ parchment
# 用 parchment 时把 mapping_channel 改成 parchment、mapping_version 改成 2023.09.03-1.20.1
mapping_channel=official
mapping_version=1.20.1

# Parchment 参数名映射（切到 parchment channel 时使用）
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# 环境版本
# 1.20.1 属 Forge 版本线；NeoForge 1.20.1 与 Forge 47.1.x 二进制兼容，共用同一套 API
# Forge 版本列表见 https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.21)
# NeoForge 1.20.1 的版本号（artifact: net.neoforged:forge:1.20.1-<neoforge_version>）
# 版本列表：https://bmclapi2.bangbang93.com/neoforge/list/1.20.1
neoforge_version=47.1.106
# 兼容用的 Forge 版本（mods.toml 依赖范围、给下游参考）
forge_version=47.1.3
forge_version_range=[47.1.3,)
loader_version_range=[47,)

## Mod 属性

# 模组唯一标识，必须小写，且与 @Mod 注解所在主类中的 MODID 常量一致
mod_id=wizardmagic
# 游戏内显示名称
mod_name=Wizard Magic
# 许可证
mod_license=All Rights Reserved
# 模组版本（语义化版本）
mod_version=0.1.0
# 发布用 group id，应与源码基础包名一致
mod_group_id=com.wizardmagic
# 作者
mod_authors=MagicalMercury
# 简介（\n 会被展开为换行）
mod_description=A magic-themed mod for Minecraft 1.20.1 (Forge/NeoForge compatible).
