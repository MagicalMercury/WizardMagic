plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // official = Mojang 官方名（Forge 1.20.1 标准配置）
    // 想要 Parchment 参数名时改成：channel: 'parchment', version: '2023.09.03-1.20.1'
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArg('-XX:+AllowEnhancedClassRedefinition')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            jvmArg('-XX:+AllowEnhancedClassRedefinition')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 国内镜像只在本地开发时启用：GitHub Actions 的 runner 在海外，
    // 访问 bmclapi 会先等 30 秒连接超时，拖慢甚至拖垮 CI。
    if (System.getenv('CI') == null) {
        // 镜像源优先：net.neoforged:forge（NeoForge 1.20.1 本体）及其 pom/userdev/universal/installer/sources
        maven {
            name = 'BMCLAPI'
            url = 'https://bmclapi2.bangbang93.com/maven'
            content {
                includeGroupByRegex 'net\\.neoforged.*'
            }
        }
    }

    // 官方 NeoForge 仓库的 CloudFront 镜像（fancymodloader 等全量在这里，国内可直连）
    maven {
        name = 'NeoForgedCDN'
        url = 'https://neoforged.forgecdn.net/releases'
        content {
            includeGroupByRegex 'net\\.neoforged.*'
        }
    }

    maven { url 'https://maven.aliyun.com/repository/public' }

    // NeoForge 依赖的公开库（log4j、cpw.mods、asm 等）
    mavenCentral()

    // Forge 系依赖（mcp_config、binarypatcher、accesstransformers 等）
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }

    // 可选：把手工准备好的 artifact 放进本地目录后启用（离线兜底）
    // maven {
    //     name = 'LocalNeoForged'
    //     url = uri("${projectDir}/libs/neoforged-maven")
    // }
}

dependencies {
    // NeoForge 1.20.1 本体（与 Forge 47.1.x 互相兼容的那条线）
    minecraft "net.neoforged:forge:${minecraft_version}-${neoforge_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // flatDir { dir 'libs' } in repositories, then:
    // implementation fg.deobf("blank:coolmod-${minecraft_version}:${coolmod_version}")
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'   // Gradle 8.x 需要
}

test {
    useJUnitPlatform()        // 少这句 JUnit5 用例一律扫不到
    systemProperty 'wizardmagic.spell.lanes', (project.findProperty('lanes') ?: '0').toString()
    // 逐条 [ok] 不往控制台放（IDEA 会把 stdout 再流一遍，导致每条出现两次、
    // 两个套件互相穿插）。失败时清单在断言消息里，所以这里放开异常格式别截断；
    // 想要完整清单直接跑 gradlew spellScriptCheck / spellLawsCheck。
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        exceptionFormat = 'full'
    }
}

// Expands ${} placeholders in mods.toml / pack.mcmeta from gradle.properties.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Attach identifying metadata to the built jar and reobfuscate it.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ------------------------------------------------ 原生内核（CMake）
//
// 单独构建，不挂在 build 上：`gradlew compileNative` / `nativeSelftest` 才跑。
// cmake 与编译器都从 PATH 里找（MSYS2 UCRT64 已经在 PATH 上），不写死任何安装路径，
// 也不覆盖 environment —— CI（ubuntu）用系统的 g++/cmake 就能编。
//   gradlew compileNative     配置 + 编译（build-native/）
//   gradlew nativeSelftest    编译 + 跑离机对拍（ctest）
def nativeRoot  = file('src/main/native')
def nativeBuild = layout.projectDirectory.dir('build-native')
def osName      = org.gradle.internal.os.OperatingSystem.current()
def generator   = osName.isWindows() ? 'MinGW Makefiles' : 'Unix Makefiles'
// JNI 头由 toolchain 解析，不写死 JDK 安装路径
def jdk17Home   = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
                        .get().metadata.installationPath.asFile.absolutePath
def cmakeArgs   = ['cmake', '-S', nativeRoot.absolutePath, '-B', nativeBuild.asFile.absolutePath,
                   '-G', generator, '-DCMAKE_BUILD_TYPE=Release', "-DWMVM_JDK=${jdk17Home}".toString()]
if (osName.isWindows()) {
    cmakeArgs += '-DCMAKE_CXX_COMPILER=g++'   // 只给名字，从 PATH 解析
}

tasks.register('configureNative', Exec) {
    group = 'native'
    description = 'CMake 配置原生代码（build-native/）'
    onlyIf { nativeRoot.exists() }
    commandLine cmakeArgs
}

tasks.register('compileNative', Exec) {
    group = 'native'
    description = '编译原生库与离机自检（build-native/）'
    dependsOn 'configureNative'
    commandLine 'cmake', '--build', nativeBuild.asFile.absolutePath, '--parallel', '8'
}

tasks.register('nativeSelftest', Exec) {
    group = 'native'
    description = '跑原生内核对拍（与 Java 实测常量比 raw bit）'
    dependsOn 'compileNative'
    commandLine 'ctest', '--test-dir', nativeBuild.asFile.absolutePath, '--output-on-failure'
}

// JNI 冒烟：把编译好的 DLL 路径喂给 Java，验证"能加载 + 能跑 + 错误码能回"。
// 没有 DLL（没装 MSYS2 的机器 / CI）就 SKIPPED，不影响 build。
tasks.register('spellNativeCheck', JavaExec) {
    group = 'verification'
    description = '原生内核 JNI 冒烟测试（没有 DLL 时自动跳过）'
    dependsOn 'compileNative'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.NativeVmCheck'
    def lib = nativeBuild.file('native.dll').asFile
    systemProperty 'wizardmagic.native.library', lib.absolutePath
    systemProperty 'wizardmagic.spell.lanes', (project.findProperty('lanes') ?: '0').toString()
    onlyIf { lib.exists() }
}

// 原生库进资源：先 `gradlew compileNative`，之后 processResources 会把它带进
// build/resources/main —— `runClient` 与打出来的 jar 就用得上。
// 没有 DLL 时这一行什么都不做（也不触发 CMake），CI 不受影响。
tasks.named('processResources', ProcessResources).configure {
    mustRunAfter 'compileNative'   // 保证复制的时候 DLL 已经编好了
    from(layout.projectDirectory.dir('build-native')) {
        include 'native.dll'
        into 'wizardmagic/native/windows/x86_64'
    }
}

// 开发时一条命令就能带着原生库进游戏（build 不受影响：CI 不会因为 CMake 变红）
// runClient 由 ForgeGradle 晚注册，所以用 matching 而不是 named
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'compileNative'
}

// 验证"游戏里那条加载路径"（从 classpath 抽出来 System.load），**不设** -Dwizardmagic.native.library
tasks.register('spellNativeResourceCheck', JavaExec) {
    group = 'verification'
    description = '从 build/resources/main 里加载原生库（模拟游戏内路径）'
    dependsOn 'processResources'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.NativeVmCheck'
    systemProperty 'wizardmagic.native.mustLoad', '1'
    systemProperty 'wizardmagic.spell.lanes', '0'
    onlyIf { nativeBuild.file('native.dll').asFile.exists() }
}

tasks.register('spellParityCheck', JavaExec) {
    group = 'verification'
    description = '原生内核 vs Java 后端：整段逐位对拍（没有 DLL 时自动跳过）'
    dependsOn 'compileNative'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.NativeVmParity'
    def lib = nativeBuild.file('native.dll').asFile
    systemProperty 'wizardmagic.native.library', lib.absolutePath
    systemProperty 'wizardmagic.spell.lanes', (project.findProperty('lanes') ?: '0').toString()
    onlyIf { lib.exists() }
}// ------------------------------------------------ 离机自检（不启动 Minecraft）
//
// 两个入口都是普通 main()，不依赖 JUnit，避免给 mod 引入测试依赖。
//   gradlew spellCheck        门禁：脚本语言 + 粒子层，跳过性能测量（build 时自动跑）
//   gradlew spellScriptCheck  只跑脚本语言自检
//   gradlew spellLawsCheck    只跑粒子层自检
//   gradlew spellPerf         性能测量（新 JVM、预热后测，耗时较长，不进 check）
tasks.withType(JavaExec).configureEach {
    // 自检输出全是中文，强制 UTF-8 免得控制台一片乱码
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
    // 4 通道寄存器机（RegVm4）默认关闭；`-Planes=1` 跑一遍"4 通道 vs 标量"的对拍
    systemProperty 'wizardmagic.spell.lanes', (project.findProperty('lanes') ?: '0').toString()
}

tasks.register('spellScriptCheck', JavaExec) {
    group = 'verification'
    description = '法术脚本自检：语法/求值/寄存器机与解释器逐位对拍/字节码缓存'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.ScriptSelfCheck'
    args 'quick'
    // -Pifdbg=1 打印 if-conversion 的判据拒绝原因；-Pifconv=0 关掉这一步做 A/B
    if (project.findProperty('ifdbg') != null) {
        systemProperty 'wizardmagic.spell.ifconv.debug', '1'
    }
    if (project.findProperty('ifconv') != null) {
        systemProperty 'wizardmagic.spell.ifconv', project.findProperty('ifconv').toString()
    }
}

// 脚本语言"语义"专项：运算符/短路/类型/内建/emit 校验/编译期检查/运行期定位/
// 双后端逐位对拍/字节码往返。和 spellScriptCheck 分开，失败时一眼看出是哪一类。
tasks.register('spellSpecCheck', JavaExec) {
    group = 'verification'
    description = '脚本语言正确性专项：语义矩阵 + 双后端对拍 + 诊断定位'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.ScriptSpecCheck'
}

tasks.register('spellLawsCheck', JavaExec) {
    group = 'verification'
    description = '法术粒子层自检：元素表/噪声/确定性/形状采样/单步成本'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.SpellSelfCheck'
}

tasks.register('spellPerf', JavaExec) {
    group = 'verification'
    description = '性能测量：解释器 vs 寄存器机（新 JVM，800 步预热）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.ScriptSelfCheck'
    args 'perf'
}

// 百万粒子压测：突破单朵 4096 / 每维度 26 万的准入上限，只看斜率。
// 结果不能代表正常游玩——正常不会这么跑。
tasks.register('spellMillion', JavaExec) {
    group = 'verification'
    description = '百万粒子压测（火焰风暴，单朵 1M + 245 朵 × 4096 + 碰撞）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.ScriptSelfCheck'
    args 'million'
    maxHeapSize = '2g'
    jvmArgs '-Dwizardmagic.spell.maxParticles=1048576'
}

// 采样剖面：跑 15 秒火焰风暴并写 JFR，用 `jfr print` 看热点
tasks.register('spellProf', JavaExec) {
    group = 'verification'
    description = '火焰风暴热点采样（JFR，输出 build/firestorm.jfr）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.ScriptSelfCheck'
    args 'prof'
    jvmArgs '-XX:StartFlightRecording=filename=build/firestorm.jfr,settings=profile,dumponexit=true',
            '-Dwizardmagic.prof.ms=15000'
}

// 微基准：单个函数的 ns 成本（unit/sin/centerAt/targetR/noise/exp/sqrt）
tasks.register('spellMicro', JavaExec) {
    group = 'verification'
    description = '单函数微基准（判断热点到底是形状、噪声还是 VM 分派）'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.ScriptSelfCheck'
    args 'micro'
}

// 原生 VM 的端到端每粒成本（同一份火焰风暴脚本走 FastProgram → JNI 原生内核）。
// 用 -Planes=1 强制标量内核做 A/B，对比默认（自适应，分支全真时保持 4/8 lane 向量）。
tasks.register('spellNativePerf', JavaExec) {
    group = 'verification'
    description = '原生 VM 每粒成本（默认 micro=best-of 最稳；-Pmode=perf 看拆分；-Planes=1 强制标量；-Pnative=0 走纯 Java）'
    dependsOn 'compileNative'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.verify.ScriptSelfCheck'
    args (project.findProperty('mode') ?: 'micro').toString()
    def lib = nativeBuild.file('native.dll').asFile
    systemProperty 'wizardmagic.native.library', lib.absolutePath
    systemProperty 'wizardmagic.spell.lanes', (project.findProperty('lanes') ?: '0').toString()
    // 真正作用于原生内核的 lane 数（0 = 自动；1 = 强制标量，用于 A/B）
    systemProperty 'wizardmagic.native.perf.lanes', (project.findProperty('lanes') ?: '0').toString()
    // -Pnative=0 关掉原生后端（量纯 Java 字节码路径，用来确认 A/B 真的走了不同后端）
    systemProperty 'wizardmagic.spell.native', (project.findProperty('native') ?: '1').toString()
    // -Ptrace=1 打开原生侧的自适应降级诊断（stderr 打降级现场与分歧率）
    if (project.findProperty('trace') != null) {
        environment 'WMVM_TRACE_DIVERGENCE', '1'
    }
    // -Pifconv=0 关掉 if-conversion（A/B 用）
    if (project.findProperty('ifconv') != null) {
        systemProperty 'wizardmagic.spell.ifconv', project.findProperty('ifconv').toString()
    }
    // -Pdbg=1 打印"为什么某个脚本没编出快速路径"（退化原因打到 stderr）
    if (project.findProperty('dbg') != null) {
        systemProperty 'wizardmagic.script.debug', '1'
    }
    onlyIf { lib.exists() }
}

tasks.register('elementAdvectCheck', JavaExec) {
    group = 'verification'
    description = '元素平流：Java / 原生 / 旧实现 三方逐位对拍 + 每格成本'
    dependsOn 'compileNative'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wizardmagic.core.elements.fluid.ElementAdvectCheck'
    def lib = nativeBuild.file('native.dll').asFile
    systemProperty 'wizardmagic.native.library', lib.absolutePath
}

tasks.register('spellCheck') {
    group = 'verification'
    description = '离机自检门禁（不含性能测量）'
    dependsOn 'spellScriptCheck', 'spellSpecCheck', 'spellLawsCheck'
}

// 门禁由 ScriptSelfCheckTest / SpellSelfCheckTest 这两个 JUnit 壳子接管（挂在 test 上）。
// 下面的 JavaExec 保留下来，用来出逐条 [ok] 清单和性能数字，不参与 test/check，
// 免得同一套断言跑两遍。

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
